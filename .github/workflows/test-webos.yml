name: Test LG webOS and Android regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install adb-shell==0.4.4 rsa cryptography pillow certifi 'websocket-client>=1.8,<2'
          npm install --no-save jsdom@24
      - name: Python regression
        run: python -m unittest discover -s tests -v
      - name: JavaScript behavior and Manager UI
        run: |
          bash tests/run_js_tests.sh
          node tests/lg_webos_ui_smoke.js
          node tests/guard_ui_smoke.js
