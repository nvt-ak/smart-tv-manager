name: Build CleanYourTV launcher APK

# Build launcher từ commit upstream được ghim trong data/cleanyourtv/launcher-pin.json
# và đăng lên release rolling `cleanyourtv-launcher` để app tải về (người dùng không cần JDK/SDK).
# Upstream: https://github.com/Gathin23/cleanyourtv (MIT).

on:
  workflow_dispatch:
  push:
    paths:
      - data/cleanyourtv/launcher-pin.json
      - .github/workflows/build-launcher.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pin
        id: pin
        run: |
          echo "commit=$(jq -r .commit data/cleanyourtv/launcher-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream launcher
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest đã có sẵn Android SDK ($ANDROID_HOME); setup-android@v3 tự cài thêm gói «tools»
      # và lỗi trên runner này → chỉ chấp nhận license để Gradle tự tải platform/build-tools còn thiếu.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Build release APK
        working-directory: upstream/launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease -q --console=plain
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify package name
        run: |
          APK=upstream/launcher/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.gathin.tvhome'"

      - name: Prepare assets
        run: |
          mkdir out
          cp upstream/launcher/app/build/outputs/apk/release/app-release.apk out/CleanYourTV.apk
          (cd out && sha256sum CleanYourTV.apk > CleanYourTV.apk.sha256)
          cp upstream/LICENSE out/CleanYourTV-LICENSE.txt
          cat out/CleanYourTV.apk.sha256

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          NOTES="CleanYourTV launcher build từ https://github.com/Gathin23/cleanyourtv @ $COMMIT (MIT). Build bởi GitHub Actions, app SmartTV Manager tải file này để cài lên TV."
          gh release view cleanyourtv-launcher >/dev/null 2>&1 \
            && gh release edit cleanyourtv-launcher --notes "$NOTES" \
            || gh release create cleanyourtv-launcher --title "CleanYourTV launcher (prebuilt)" --notes "$NOTES" --prerelease
          gh release upload cleanyourtv-launcher out/CleanYourTV.apk out/CleanYourTV.apk.sha256 out/CleanYourTV-LICENSE.txt --clobber
